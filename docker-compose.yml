services:
  viewer:
    build: .
    image: demoworldfun-viewer:latest
    container_name: demoworldfun-viewer
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8100}:8000"
    env_file: .env
    volumes:
      # Persists UI-entered OIDC settings across container recreation.
      - viewer-data:/data

volumes:
  viewer-data:
